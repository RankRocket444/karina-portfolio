<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vidaloka&family=Pinyon+Script&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000000;
      --white: #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 1.75rem 3rem;
      gap: 2.5rem;
      background: rgba(0, 0, 0, 0.72);
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    nav a:hover { opacity: 1; }
    nav a.active { opacity: 1; border-bottom: 1px solid var(--white); padding-bottom: 2px; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 9rem 2rem 3.5rem;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'Vidaloka', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .page-header p {
      font-family: 'Pinyon Script', cursive;
      font-style: italic;
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      opacity: 0.85;
      margin-top: 0.5rem;
    }

    /* ── MASONRY GRID ── */
    .masonry {
      columns: 3;
      column-gap: 0.75rem;
      max-width: 1200px;
      margin: 0 auto 6rem;
      padding: 0 1.5rem;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 0.75rem;
      overflow: hidden;
      cursor: pointer;
    }

    .masonry-item img {
      width: 100%;
      display: block;
      filter: grayscale(100%);
      transition: filter 0.35s, transform 0.4s;
    }

    .masonry-item:hover img {
      filter: grayscale(100%) brightness(1.1);
      transform: scale(1.03);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.95);
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .lightbox.open {
      display: flex;
      opacity: 0;
      animation: lb-fade-in 0.35s forwards;
    }

    .lightbox.closing {
      animation: lb-fade-out 0.3s forwards;
    }

    @keyframes lb-fade-in  { to   { opacity: 1; } }
    @keyframes lb-fade-out { from { opacity: 1; } to { opacity: 0; } }

    .lb-img-wrap {
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-img-wrap img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      display: block;
      filter: grayscale(100%);
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.3s 0.1s, transform 0.3s 0.1s;
    }

    .lightbox.open .lb-img-wrap img {
      opacity: 1;
      transform: scale(1);
    }

    /* close button */
    .lb-close {
      position: fixed;
      top: 1.5rem; right: 1.75rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      width: 2.6rem; height: 2.6rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, opacity 0.2s;
      opacity: 0.75;
    }

    .lb-close:hover { opacity: 1; border-color: var(--white); }

    /* arrow buttons */
    .lb-arrow {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--white);
      font-size: 1.1rem;
      width: 2.8rem; height: 2.8rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, opacity 0.2s;
      opacity: 0.65;
    }

    .lb-arrow:hover { opacity: 1; border-color: var(--white); }
    .lb-prev { left: 1.25rem; }
    .lb-next { right: 1.25rem; }

    /* ── FADE-IN ANIMATIONS ── */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in-load {
      opacity: 0;
      animation: fade-in-up 1.1s ease forwards;
    }

    .fade-in-scroll {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .fade-in-scroll.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── SCROLL TO TOP ── */
    .scroll-top {
      position: fixed;
      bottom: 1.75rem;
      right: 1.75rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
      z-index: 200;
    }

    .scroll-top.visible {
      opacity: 0.9;
      visibility: visible;
      transform: translateY(0);
    }

    .scroll-top:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.8);
    }

    .scroll-top svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .masonry { columns: 2; }
    }

    @media (max-width: 560px) {
      nav {
        justify-content: center;
        flex-wrap: wrap;
        padding: 1.25rem 1.5rem;
        gap: 1.5rem;
      }

      .masonry { columns: 1; max-width: 400px; }

      .page-header { padding-top: 7rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- PAGE HEADER -->
  <header class="page-header fade-in-load">
    <h1>Gallery</h1>
    <p>Every frame, a love story</p>
  </header>

  <!-- MASONRY GRID -->
  <!-- PLACEHOLDER: replace picsum.photos src values with real photos -->
  <section class="masonry fade-in-scroll" id="gallery">
    <div class="masonry-item" data-index="0">
      <img src="https://picsum.photos/seed/w1/600/800"  alt="Wedding photo 1"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="1">
      <img src="https://picsum.photos/seed/w2/600/500"  alt="Wedding photo 2"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="2">
      <img src="https://picsum.photos/seed/w3/600/750"  alt="Wedding photo 3"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="3">
      <img src="https://picsum.photos/seed/w4/600/900"  alt="Wedding photo 4"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="4">
      <img src="https://picsum.photos/seed/w5/600/600"  alt="Wedding photo 5"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="5">
      <img src="https://picsum.photos/seed/w6/600/820"  alt="Wedding photo 6"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="6">
      <img src="https://picsum.photos/seed/w7/600/700"  alt="Wedding photo 7"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="7">
      <img src="https://picsum.photos/seed/w8/600/550"  alt="Wedding photo 8"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="8">
      <img src="https://picsum.photos/seed/w9/600/860"  alt="Wedding photo 9"  loading="lazy" />
    </div>
    <div class="masonry-item" data-index="9">
      <img src="https://picsum.photos/seed/w10/600/680" alt="Wedding photo 10" loading="lazy" />
    </div>
    <div class="masonry-item" data-index="10">
      <img src="https://picsum.photos/seed/w11/600/760" alt="Wedding photo 11" loading="lazy" />
    </div>
    <div class="masonry-item" data-index="11">
      <img src="https://picsum.photos/seed/w12/600/500" alt="Wedding photo 12" loading="lazy" />
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">
    <button class="lb-close" id="lb-close" aria-label="Close">&#x2715;</button>
    <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous photo">&#8592;</button>
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="Enlarged wedding photo" />
    </div>
    <button class="lb-arrow lb-next" id="lb-next" aria-label="Next photo">&#8594;</button>
  </div>

  <script>
    const items    = Array.from(document.querySelectorAll('.masonry-item'));
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lb-img');
    const lbClose  = document.getElementById('lb-close');
    const lbPrev   = document.getElementById('lb-prev');
    const lbNext   = document.getElementById('lb-next');
    let current    = 0;

    function getSrc(index) {
      return items[index].querySelector('img').src;
    }

    function open(index) {
      current = index;
      lbImg.src = getSrc(current);
      lightbox.classList.remove('closing');
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lightbox.classList.add('closing');
      lightbox.addEventListener('animationend', () => {
        lightbox.classList.remove('open', 'closing');
        lbImg.src = '';
        document.body.style.overflow = '';
      }, { once: true });
    }

    function navigate(dir) {
      current = (current + dir + items.length) % items.length;
      lbImg.style.opacity = '0';
      lbImg.style.transform = 'scale(0.96)';
      setTimeout(() => {
        lbImg.src = getSrc(current);
        lbImg.style.opacity = '1';
        lbImg.style.transform = 'scale(1)';
      }, 160);
    }

    items.forEach((item, i) => item.addEventListener('click', () => open(i)));
    lbClose.addEventListener('click', close);
    lbPrev.addEventListener('click', () => navigate(-1));
    lbNext.addEventListener('click', () => navigate(1));

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) close();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      close();
      if (e.key === 'ArrowLeft')   navigate(-1);
      if (e.key === 'ArrowRight')  navigate(1);
    });
  </script>

  <!-- SCROLL TO TOP -->
  <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </svg>
  </button>

  <script>
    const fadeEls = document.querySelectorAll('.fade-in-scroll');
    const fadeObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          fadeObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    fadeEls.forEach((el) => fadeObserver.observe(el));

    const scrollTopBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
