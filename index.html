<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vidaloka&family=Pinyon+Script&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000000;
      --white: #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
    }

    /* ── NAV ── */
    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 1.75rem 3rem;
      gap: 2.5rem;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    nav a:hover { opacity: 1; }
    nav a.active { opacity: 1; border-bottom: 1px solid var(--white); padding-bottom: 2px; }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 78vh;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;

      /* placeholder background – replace with a real image URL */
      background-image: url('https://via.placeholder.com/1920x1080/222222/555555?text=Hero+Photo');
      background-size: cover;
      background-position: center;
    }

    /* dark overlay */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .hero-name {
      font-family: 'Vidaloka', serif;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--white);
    }

    .hero-tagline {
      font-family: 'Pinyon Script', cursive;
      font-style: italic;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 400;
      color: var(--white);
      opacity: 0.9;
      letter-spacing: 0.02em;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.75rem;
    }

    .hero-cta a {
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.7);
      color: var(--white);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.85rem 1.9rem;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }

    .hero-cta a:hover {
      background: var(--white);
      color: var(--black);
      border-color: var(--white);
    }

    /* ── INTRO ── */
    .intro {
      max-width: 640px;
      margin: 5rem auto;
      padding: 0 2rem;
      text-align: center;
    }

    .intro p {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 1.05rem;
      line-height: 1.85;
      color: rgba(255, 255, 255, 0.8);
    }

    /* ── GALLERY PREVIEW ── */
    .gallery-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      max-width: 1100px;
      margin: 0 auto 6rem;
      padding: 0 2rem;
    }

    .thumb {
      aspect-ratio: 3 / 4;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition: filter 0.3s, transform 0.4s;
    }

    .thumb img:hover {
      filter: grayscale(100%) brightness(1.08);
      transform: scale(1.03);
    }

    /* ── FADE-IN ANIMATIONS ── */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in-load {
      opacity: 0;
      animation: fade-in-up 1.1s ease forwards;
    }

    .fade-in-scroll {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .fade-in-scroll.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── SCROLL TO TOP ── */
    .scroll-top {
      position: fixed;
      bottom: 1.75rem;
      right: 1.75rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease;
      z-index: 200;
    }

    .scroll-top.visible {
      opacity: 0.9;
      visibility: visible;
      transform: translateY(0);
    }

    .scroll-top:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.8);
    }

    .scroll-top svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      nav {
        justify-content: center;
        flex-wrap: wrap;
        padding: 1.25rem 1.5rem;
        gap: 1.5rem;
      }

      .gallery-preview {
        grid-template-columns: 1fr;
        max-width: 400px;
      }

      .intro { margin: 3.5rem auto; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content fade-in-load">
      <h1 class="hero-name">Karina</h1>
      <p class="hero-tagline">Capturing Love Stories</p>
      <div class="hero-cta">
        <a href="gallery.html">View Gallery</a>
        <a href="contact.html">Inquire Now</a>
      </div>
    </div>
  </section>

  <!-- INTRO -->
  <section class="intro fade-in-scroll">
    <p>
      <!-- PLACEHOLDER: replace with Karina's real bio -->
      Based in [City], Karina is a wedding photographer dedicated to telling
      your story through honest, timeless images. Every frame is a quiet
      moment made permanent — the glance, the laugh, the tear you almost
      missed.
    </p>
  </section>

  <!-- GALLERY PREVIEW -->
  <section class="gallery-preview fade-in-scroll">
    <!-- PLACEHOLDER: replace src values with real photo paths or URLs -->
    <div class="thumb">
      <img src="https://picsum.photos/seed/kp1/600/800" alt="Wedding preview 1" />
    </div>
    <div class="thumb">
      <img src="https://picsum.photos/seed/kp2/600/800" alt="Wedding preview 2" />
    </div>
    <div class="thumb">
      <img src="https://picsum.photos/seed/kp3/600/800" alt="Wedding preview 3" />
    </div>
  </section>

  <!-- SCROLL TO TOP -->
  <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </svg>
  </button>

  <script>
    const fadeEls = document.querySelectorAll('.fade-in-scroll');
    const fadeObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          fadeObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    fadeEls.forEach((el) => fadeObserver.observe(el));

    const scrollTopBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
